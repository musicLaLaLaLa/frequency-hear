<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frequency Hear</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f3f4f6;
      color: #111827;
    }

    main {
      width: min(90vw, 480px);
      padding: 32px;
      box-sizing: border-box;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
    }

    .frequency-row,
    .button-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .frequency-row {
      font-size: 18px;
    }

    input {
      min-width: 0;
      width: 140px;
      padding: 9px 10px;
      border: 1px solid #9ca3af;
      border-radius: 7px;
      font: inherit;
    }

    .button-row {
      margin-top: 24px;
      gap: 20px;
    }

    button {
      width: 100px;
      height: 42px;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    #play { background: #16803c; }
    #stop { background: #c62828; }
    button:hover { filter: brightness(1.08); }
    button:active { transform: translateY(1px); }

    #status {
      min-height: 1.5em;
      margin: 18px 0 0;
      color: #4b5563;
    }

    @media (prefers-color-scheme: dark) {
      body { background: #111827; color: #f9fafb; }
      main { background: #1f2937; }
      #status { color: #d1d5db; }
    }
  </style>
</head>
<body>
  <main>
    <div class="frequency-row">
      <label for="frequency">Frequency =</label>
      <input id="frequency" type="number" value="440.3" min="1" max="22000" step="any" inputmode="decimal">
      <span>Hz</span>
    </div>

    <div class="button-row">
      <button id="play" type="button">PLAY</button>
      <button id="stop" type="button">STOP</button>
    </div>

    <p id="status" role="status" aria-live="polite">Stopped</p>
  </main>

  <script>
    "use strict";

    const frequencyInput = document.querySelector("#frequency");
    const playButton = document.querySelector("#play");
    const stopButton = document.querySelector("#stop");
    const status = document.querySelector("#status");

    let audioContext = null;
    let oscillator = null;
    let gainNode = null;

    function stopSound() {
      if (oscillator) {
        try {
          oscillator.stop();
        } catch (_) {
          // The oscillator may already have stopped.
        }
        oscillator.disconnect();
        oscillator = null;
      }

      if (gainNode) {
        gainNode.disconnect();
        gainNode = null;
      }

      status.textContent = "Stopped";
    }

    async function playSound() {
      const frequency = Number(frequencyInput.value);

      if (!Number.isFinite(frequency) || frequency <= 0 || frequency > 22000) {
        status.textContent = "請輸入 1 到 22000 Hz 之間的頻率。";
        frequencyInput.focus();
        return;
      }

      stopSound();

      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) {
        status.textContent = "這個瀏覽器不支援 Web Audio API。";
        return;
      }

      if (!audioContext) {
        audioContext = new AudioContextClass();
      }
      if (audioContext.state === "suspended") {
        await audioContext.resume();
      }

      oscillator = audioContext.createOscillator();
      gainNode = audioContext.createGain();
      oscillator.type = "sine";
      oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
      gainNode.gain.setValueAtTime(0.25, audioContext.currentTime);
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      oscillator.start();

      status.textContent = `Playing ${frequency} Hz`;
    }

    playButton.addEventListener("click", () => {
      playSound().catch(() => {
        stopSound();
        status.textContent = "無法播放聲音，請再按一次 PLAY。";
      });
    });
    stopButton.addEventListener("click", stopSound);
    window.addEventListener("pagehide", stopSound);
  </script>
</body>
</html>
